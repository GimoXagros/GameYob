name: Core regression tests

on:
  push:
    paths:
      - "platform/common/**"
      - "platform/3ds/gbgfx.cpp"
      - "platform/3ds/soundengine.cpp"
      - "platform/ds/arm9/source/nifi.cpp"
      - "tests/**"
      - ".github/workflows/core-regression-tests.yml"
  pull_request:
    paths:
      - "platform/common/**"
      - "platform/3ds/gbgfx.cpp"
      - "platform/3ds/soundengine.cpp"
      - "platform/ds/arm9/source/nifi.cpp"
      - "tests/**"
      - ".github/workflows/core-regression-tests.yml"

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run NiFi protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/nifi_protocol_test.cpp platform/common/nifi_protocol.cpp \
            -o /tmp/nifi_protocol_test
          /tmp/nifi_protocol_test
      - name: Build and run rendering rule tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/gb_render_rules_test.cpp platform/common/gb_render_rules.cpp \
            -o /tmp/gb_render_rules_test
          /tmp/gb_render_rules_test
      - name: Build and run noise LFSR tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/gb_noise_test.cpp platform/common/gb_noise.cpp \
            -o /tmp/gb_noise_test
          /tmp/gb_noise_test
      - name: Build and run save-state validation tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include tests/state_validation_test.cpp \
            -o /tmp/state_validation_test
          /tmp/state_validation_test
      - name: Build and run RTC clock tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/rtc_test.cpp platform/common/rtc.cpp \
            -o /tmp/rtc_test
          /tmp/rtc_test
      - name: Build and run ROM layout tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/rom_layout_test.cpp platform/common/rom_layout.cpp \
            -o /tmp/rom_layout_test
          /tmp/rom_layout_test
      - name: Build and run MMM01 mapper tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/mmm01_test.cpp platform/common/mmm01.cpp \
            platform/common/rom_layout.cpp -o /tmp/mmm01_test
          /tmp/mmm01_test
      - name: Build and run SGB host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_host_test.cpp platform/common/sgb_host.cpp \
            -o /tmp/sgb_host_test
          /tmp/sgb_host_test
      - name: Build and run SGB baseline regression tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_host_baseline_test.cpp platform/common/sgb_host.cpp \
            -o /tmp/sgb_host_baseline_test
          /tmp/sgb_host_baseline_test
      - name: Build and run SGB border decoder tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgbborder_test.cpp platform/common/sgbborder.cpp \
            -o /tmp/sgbborder_test
          /tmp/sgbborder_test
      - name: Build and run SGB protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_protocol_test.cpp platform/common/sgb_protocol.cpp \
            -o /tmp/sgb_protocol_test
          /tmp/sgb_protocol_test
      - name: Build and run localization tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DC_IO_FUNCTIONS \
            -Iplatform/common/include \
            tests/localization_test.cpp platform/common/localization.cpp \
            platform/common/io.cpp -o /tmp/localization_test
          /tmp/localization_test
      - name: Build and run file I/O tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DC_IO_FUNCTIONS \
            -Iplatform/common/include \
            tests/io_test.cpp platform/common/io.cpp -o /tmp/io_test
          /tmp/io_test
      - name: Build and run Unicode text tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/text_test.cpp platform/common/text.cpp \
            -o /tmp/text_test
          /tmp/text_test
      - name: Build and run file chooser path tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/filechooser_path_test.cpp \
            platform/common/filechooser_path.cpp \
            -o /tmp/filechooser_path_test
          /tmp/filechooser_path_test
      - name: Build and run touch UI tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/touch_ui_test.cpp platform/common/touch_ui.cpp \
            -o /tmp/touch_ui_test
          /tmp/touch_ui_test
      - name: Build and run MBC7 EEPROM tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/mbc7_eeprom_test.cpp platform/common/mbc7_eeprom.cpp \
            -o /tmp/mbc7_eeprom_test
          /tmp/mbc7_eeprom_test
      - name: Build and run HuC1 mapper-rule tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/huc1_rules_test.cpp platform/common/huc1_rules.cpp \
            -o /tmp/huc1_rules_test
          /tmp/huc1_rules_test
