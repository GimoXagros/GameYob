name: Core regression tests

on:
  push:
    paths:
      - "platform/common/**"
      - "platform/3ds/gbgfx.cpp"
      - "platform/3ds/soundengine.cpp"
      - "platform/ds/arm9/source/nifi.cpp"
      - "tests/**"
      - ".github/workflows/core-regression-tests.yml"
  pull_request:
    paths:
      - "platform/common/**"
      - "platform/3ds/gbgfx.cpp"
      - "platform/3ds/soundengine.cpp"
      - "platform/ds/arm9/source/nifi.cpp"
      - "tests/**"
      - ".github/workflows/core-regression-tests.yml"

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SGB opcode coverage inventory
        run: python3 tools/sgb_opcode_coverage.py --check
      - name: Build and run NiFi protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/nifi_protocol_test.cpp platform/common/nifi_protocol.cpp \
            -o /tmp/nifi_protocol_test
          /tmp/nifi_protocol_test
      - name: Build and run rendering rule tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/gb_render_rules_test.cpp platform/common/gb_render_rules.cpp \
            -o /tmp/gb_render_rules_test
          /tmp/gb_render_rules_test
      - name: Build and run noise LFSR tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/gb_noise_test.cpp platform/common/gb_noise.cpp \
            -o /tmp/gb_noise_test
          /tmp/gb_noise_test
      - name: Build and run save-state validation tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include tests/state_validation_test.cpp \
            -o /tmp/state_validation_test
          /tmp/state_validation_test
      - name: Build and run RTC clock tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/rtc_test.cpp platform/common/rtc.cpp \
            -o /tmp/rtc_test
          /tmp/rtc_test
      - name: Build and run ROM layout tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/rom_layout_test.cpp platform/common/rom_layout.cpp \
            -o /tmp/rom_layout_test
          /tmp/rom_layout_test
      - name: Build and run MMM01 mapper tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/mmm01_test.cpp platform/common/mmm01.cpp \
            platform/common/rom_layout.cpp -o /tmp/mmm01_test
          /tmp/mmm01_test
      - name: Build and run SGB host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_host_test.cpp platform/common/sgb_host.cpp \
            -o /tmp/sgb_host_test
          /tmp/sgb_host_test
      - name: Build and run SGB baseline regression tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_host_baseline_test.cpp platform/common/sgb_host.cpp \
            -o /tmp/sgb_host_baseline_test
          /tmp/sgb_host_baseline_test
      - name: Build and run 65C816 instruction vectors
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_65c816_vectors_test.cpp platform/common/sgb_host.cpp \
            -o /tmp/sgb_65c816_vectors_test
          /tmp/sgb_65c816_vectors_test
      - name: Build and run SGB border decoder tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgbborder_test.cpp platform/common/sgbborder.cpp \
            -o /tmp/sgbborder_test
          /tmp/sgbborder_test
      - name: Build and run SGB protocol tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/sgb_protocol_test.cpp platform/common/sgb_protocol.cpp \
            -o /tmp/sgb_protocol_test
          /tmp/sgb_protocol_test
      - name: Build and run localization tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DC_IO_FUNCTIONS \
            -Iplatform/common/include \
            tests/localization_test.cpp platform/common/localization.cpp \
            platform/common/io.cpp -o /tmp/localization_test
          /tmp/localization_test
      - name: Build and run file I/O tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -DC_IO_FUNCTIONS \
            -Iplatform/common/include \
            tests/io_test.cpp platform/common/io.cpp -o /tmp/io_test
          /tmp/io_test
      - name: Build and run Unicode text tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/text_test.cpp platform/common/text.cpp \
            -o /tmp/text_test
          /tmp/text_test
      - name: Build and run file chooser path tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/filechooser_path_test.cpp \
            platform/common/filechooser_path.cpp \
            -o /tmp/filechooser_path_test
          /tmp/filechooser_path_test
      - name: Build and run touch UI tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/touch_ui_test.cpp platform/common/touch_ui.cpp \
            -o /tmp/touch_ui_test
          /tmp/touch_ui_test
      - name: Build and run MBC7 EEPROM tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/mbc7_eeprom_test.cpp platform/common/mbc7_eeprom.cpp \
            -o /tmp/mbc7_eeprom_test
          /tmp/mbc7_eeprom_test
      - name: Build and run HuC1 mapper-rule tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror \
            -Iplatform/common/include \
            tests/huc1_rules_test.cpp platform/common/huc1_rules.cpp \
            -o /tmp/huc1_rules_test
          /tmp/huc1_rules_test
      - name: Build and run ROM reload lifecycle tests
        run: |
          g++ -std=c++17 -w -ffunction-sections -fdata-sections -Wl,--gc-sections -DMANAGER_TEST -DNIFI -DSDL -DC_IO_FUNCTIONS -include platform/sdl/include/typedefs.h -Itests/support -Iplatform/common/include tests/romfile_bios_lifecycle_test.cpp platform/common/gbmanager.cpp platform/common/romfile.cpp platform/common/gameboy.cpp platform/common/mmu.cpp platform/common/mbc.cpp platform/common/sgb.cpp platform/common/sgb_host.cpp platform/common/sgb_protocol.cpp platform/common/huc1_rules.cpp platform/common/rtc.cpp platform/common/gbcpu.cpp platform/common/rom_layout.cpp platform/common/nifi_protocol.cpp platform/common/mmm01.cpp platform/common/mbc7_eeprom.cpp -o /tmp/rom_reload_lifecycle_test
          /tmp/rom_reload_lifecycle_test
      - name: Build and run SGB idle-host tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Iplatform/common/include tests/sgb_host_idle_test.cpp platform/common/sgb_host.cpp -o /tmp/sgb_host_idle_test
          /tmp/sgb_host_idle_test
      - name: Build and run bounded VBlank queue tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/vblank_task_queue_test.cpp -o /tmp/vblank_task_queue_test
          /tmp/vblank_task_queue_test
      - name: Build and run frame trace invariant tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/video_frame_trace_test.cpp -o /tmp/video_frame_trace_test
          /tmp/video_frame_trace_test
      - name: Build and run publication profile tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/video_trace_profile_test.cpp -o /tmp/video_trace_profile_test
          /tmp/video_trace_profile_test
          g++ -std=c++11 -Wall -Wextra -Werror -DGAMEYOB_VIDEO_TRACE -DGAMEYOB_VIDEO_PUBLICATION_ONLY \
            tests/video_trace_profile_export_test.cpp platform/ds/arm9/source/video_trace_profile_export.cpp \
            -o /tmp/video_trace_profile_export_test
          trace_dir="$(mktemp -d)"
          /tmp/video_trace_profile_export_test "$trace_dir/"
      - name: Build and run synthetic printer packet and BMP tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/gbprinter_test.cpp -o /tmp/gbprinter_test
          /tmp/gbprinter_test
      - name: Build and run production-linked border probe isolation tests
        run: |
          g++ -std=c++17 -w -ffunction-sections -fdata-sections -Wl,--gc-sections -DBORDER_PROBE_TEST -DMANAGER_TEST -DNIFI -DSDL -DC_IO_FUNCTIONS -include platform/sdl/include/typedefs.h -Itests/support -Iplatform/common/include tests/sgb_probe_save_isolation_test.cpp platform/common/gbmanager.cpp platform/common/romfile.cpp platform/common/gameboy.cpp platform/common/mmu.cpp platform/common/mbc.cpp platform/common/sgb.cpp platform/common/sgb_host.cpp platform/common/sgb_protocol.cpp platform/common/huc1_rules.cpp platform/common/rtc.cpp platform/common/gbcpu.cpp platform/common/rom_layout.cpp platform/common/nifi_protocol.cpp platform/common/mmm01.cpp platform/common/mbc7_eeprom.cpp -o /tmp/sgb_probe_save_isolation_test
          /tmp/sgb_probe_save_isolation_test
      - name: Build and run SGB probe host-control tests
        run: |
          g++ -std=c++17 -w -ffunction-sections -fdata-sections -Wl,--gc-sections -DBORDER_INPUT_TEST -DMANAGER_TEST -DNIFI -DSDL -DC_IO_FUNCTIONS -include platform/sdl/include/typedefs.h -Itests/support -Iplatform/common/include tests/sgb_probe_host_input_test.cpp platform/common/gbmanager.cpp platform/common/romfile.cpp platform/common/gameboy.cpp platform/common/mmu.cpp platform/common/mbc.cpp platform/common/sgb.cpp platform/common/sgb_host.cpp platform/common/sgb_protocol.cpp platform/common/huc1_rules.cpp platform/common/rtc.cpp platform/common/gbcpu.cpp platform/common/rom_layout.cpp platform/common/nifi_protocol.cpp platform/common/mmm01.cpp platform/common/mbc7_eeprom.cpp -o /tmp/sgb_probe_host_input_test
          /tmp/sgb_probe_host_input_test
      - name: Build and run FF01/FF02 printer serial integration tests
        run: |
          g++ -std=c++17 -w -ffunction-sections -fdata-sections -Wl,--gc-sections -DMANAGER_TEST -DNIFI -DSDL -DC_IO_FUNCTIONS -include platform/sdl/include/typedefs.h -Itests/support -Iplatform/common/include tests/gbprinter_serial_integration_test.cpp platform/common/gbmanager.cpp platform/common/romfile.cpp platform/common/gameboy.cpp platform/common/mmu.cpp platform/common/mbc.cpp platform/common/sgb.cpp platform/common/sgb_host.cpp platform/common/sgb_protocol.cpp platform/common/huc1_rules.cpp platform/common/rtc.cpp platform/common/gbcpu.cpp platform/common/rom_layout.cpp platform/common/nifi_protocol.cpp platform/common/mmm01.cpp platform/common/mbc7_eeprom.cpp platform/common/gbprinter.cpp -o /tmp/gbprinter_serial_integration_test
          /tmp/gbprinter_serial_integration_test
