name: Nintendo DS build

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/ds/**"
      - "platform/common/**"
      - "assets/fonts/**"
      - "Makefile.blocksds*"
      - ".github/workflows/build-ds.yml"
  pull_request:
    paths:
      - "platform/ds/**"
      - "platform/common/**"
      - "assets/fonts/**"
      - "Makefile.blocksds*"
      - ".github/workflows/build-ds.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NDS homebrew
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            skylyrac/blocksds:slim-v1.22.2@sha256:a073c57ffd340542a6e09d14616dd925d219bc534399dbdc73d2abaa04c1628e \
            bash -euo pipefail -c '
              git config --global --add safe.directory /workspace
              make -f Makefile.blocksds
            '
      - name: Record artifact checksum
        run: |
          sha256sum \
            platform/ds/gameyob.nds \
            platform/ds/gameyob_dsi.nds \
            > platform/ds/SHA256SUMS.txt
      - name: Upload Nintendo DS build
        uses: actions/upload-artifact@v4
        with:
          name: gameyob-ds-${{ github.sha }}
          path: |
            platform/ds/gameyob.nds
            platform/ds/gameyob_dsi.nds
            platform/ds/SHA256SUMS.txt
          if-no-files-found: error
