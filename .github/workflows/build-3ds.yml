name: Native 3DS build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or branch to build (defaults to the triggering ref)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Record source revision
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build 3DSX
        run: |
          docker run --rm \
          --volume "$GITHUB_WORKSPACE:/workspace" \
          --workdir /workspace/platform/3ds \
          devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b \
          bash -euo pipefail -c '
            git config --global --add safe.directory /workspace &&
            sed -i "\|#include <3ds/console.h>|d" \
              "$DEVKITPRO/libctru/include/3ds.h" &&
            make 3dsx
          '

      - name: Record artifact checksum
        run: sha256sum platform/3ds/gameyob.3dsx > platform/3ds/SHA256SUMS.txt

      - name: Upload native 3DS build
        uses: actions/upload-artifact@v4
        with:
          name: gameyob-3ds-${{ steps.source.outputs.sha }}
          path: |
            platform/3ds/gameyob.3dsx
            platform/3ds/gameyob.elf
            platform/3ds/build/gameyob.map
            platform/3ds/SHA256SUMS.txt
          if-no-files-found: error
